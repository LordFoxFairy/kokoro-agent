name: CI

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 锁定依赖安装：uv.lock 用官方源锁定（UV_NO_CONFIG），CI 无本地镜像配置，直接走锁文件。
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check src tests
      - name: pyright
        run: uv run pyright
      - name: pytest (unit + contract fast gate)
        run: uv run pytest -q -m "not integration and not e2e and not acceptance" tests/unit tests/contract

  service-acceptance:
    runs-on: ubuntu-latest
    # The complete gate owns real PostgreSQL and Redis fixtures. Tests fail loudly if either is absent.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kokoro_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kokoro_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      KOKORO_REDIS_URL: redis://127.0.0.1:6379/0
      KOKORO_AGENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kokoro_agent
      KOKORO_AGENT_DATABASE_SCHEMA: kokoro_agent_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: verify PostgreSQL and Redis fixtures
        run: |
          uv run python - <<'PY'
          import asyncio
          import os

          import psycopg
          from redis.asyncio import Redis

          async def main() -> None:
              async with await psycopg.AsyncConnection.connect(
                  os.environ["KOKORO_AGENT_DATABASE_URL"]
              ) as connection:
                  async with connection.cursor() as cursor:
                      await cursor.execute("SELECT 1")

              redis = Redis.from_url(os.environ["KOKORO_REDIS_URL"])
              try:
                  assert await redis.ping()
              finally:
                  await redis.aclose()

          asyncio.run(main())
          PY
      - name: ruff
        run: uv run ruff check src tests
      - name: pyright
        run: uv run pyright
      - name: pytest (complete service acceptance gate)
        run: >-
          uv run pytest -q -o addopts=''
          tests/unit tests/contract tests/integration tests/e2e tests/acceptance
