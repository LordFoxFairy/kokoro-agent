name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    # Runtime tests require both durable backends and fail loudly when either is absent.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      KOKORO_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # uv 也会自己读 .python-version；写在这里是为了让解释器版本在 workflow 里可见，
          # 因为此前既无这个 input 也无该文件，CI 跑在 runner 恰好提供的任意解释器上。
          python-version-file: .python-version
      # uv.lock 的制品 URL 目前指向本地镜像而非官方源，UV_NO_CONFIG 改不了已写死的地址；
      # 修法见根仓待办（需在版本约束下对官方源重解析并证明零漂移），本步骤依赖网络可达。
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check src tests
      - name: pyright
        run: uv run pyright
      - name: pytest
        run: uv run pytest -q
