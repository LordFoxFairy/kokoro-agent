          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelAdmissionError'
        '503':
          description: Dependency or shared deadline unavailable
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelAdmissionError'
