          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSettlementError'
        '403':
          description: Dedicated service or original payer denied
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSettlementError'
        '404':
          description: Original submission not visible
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSettlementError'
        '409':
          description: Permanent command conflict
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSettlementError'
        '422':
          description: Evidence or attempt ineligible
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSettlementError'
        '502':
          description: Invalid upstream acknowledgement
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSettlementError'
        '503':
          description: Dependency or shared deadline unavailable
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelSettlementError'
  /internal/v1/project-execution-bindings/verify:
    post:
      operationId: verifyProjectExecutionBinding
      summary: Read current BFF-owned execution intent; not an execution permit
      x-kokoro-owner: kokoro-bff
      x-kokoro-visibility: internal
      x-kokoro-stability: stable
      x-kokoro-idempotency: read-only-no-receipt
      x-kokoro-permission: iam.project_execution_binding
      security:
        - IamBindingReaderBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectExecutionBindingRequest'
      responses:
        '200':
