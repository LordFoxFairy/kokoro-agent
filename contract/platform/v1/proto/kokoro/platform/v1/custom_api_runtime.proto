syntax = "proto3";

package kokoro.platform.v1;

// Internal execution-only API. Product CRUD credentials never authorize this service.
service CustomApiRuntimeService {
  rpc DescribeCustomApiEnvironment(DescribeCustomApiEnvironmentRequest) returns (DescribeCustomApiEnvironmentResponse);
  rpc AcquireCustomApiEnvironment(AcquireCustomApiEnvironmentRequest) returns (AcquireCustomApiEnvironmentResponse);
}

message CustomApiRuntimeProfileRef {
  string profile_id = 1;
  int64 expected_state_version = 2;
}

message DescribeCustomApiEnvironmentRequest {
  reserved "tenant_id", "actor_id", "subject_id", "run_id", "session_id", "environment", "command";
  string request_id = 1;
  string invocation_id = 2;
  repeated CustomApiRuntimeProfileRef profiles = 3;
  string execution_proof = 100;
}

message CustomApiRuntimeProfileDescription {
  string profile_id = 1;
  int64 state_version = 2;
  string name = 3;
  string instructions = 4;
  repeated string environment_names = 5;
}

message DescribeCustomApiEnvironmentResponse {
  string request_binding_sha256 = 1;
  string run_id = 2;
  string execution_session_id = 3;
  repeated CustomApiRuntimeProfileDescription profiles = 4;
}

message AcquireCustomApiEnvironmentRequest {
  reserved "tenant_id", "actor_id", "subject_id", "run_id", "session_id", "environment", "command";
  string request_id = 1;
  string invocation_id = 2;
  repeated CustomApiRuntimeProfileRef profiles = 3;
  string execution_proof = 100;
}

message CustomApiRuntimeEnvironmentValue {
  string name = 1;
  // Sensitive UTF-8 material. Never persist, log, or put into model messages.
  bytes value = 2;
}

message AcquireCustomApiEnvironmentResponse {
  string request_binding_sha256 = 1;
  string run_id = 2;
  string execution_session_id = 3;
  repeated CustomApiRuntimeEnvironmentValue environment = 4;
}
