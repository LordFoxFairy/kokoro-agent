// Custom API is a distinct personal configuration aggregate. It deliberately has
// no URL, provider, OAuth, execution, or MCP transport fields.
message CustomApiEnvironmentWrite { string name = 1; string value = 2; }
message CustomApiEnvironmentDescriptor { string name = 1; bool configured = 2; uint64 state_version = 3; string status = 4; }
message PersonalCustomApi {
  kokoro.platform.v1.CustomApiProfileId profile_id = 1;
  string name = 2;
  optional string instructions = 3;
  uint64 state_version = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated kokoro.platform.v1.CustomApiEnvironmentDescriptor environment = 7;
  kokoro.platform.v1.PersonalMcpIconBinding icon = 8;
}
message CreatePersonalCustomApiRequest {
  reserved 100;
  reserved "tenant_id", "actor_id", "subject_id", "owner_scope", "target_owner_scope", "product_context", "execution_proof", "attestation";
  string request_id = 1;
  kokoro.common.v1.CommandIdentity command = 2;
  string name = 3;
  optional string instructions = 4;
  repeated kokoro.platform.v1.CustomApiEnvironmentWrite environment = 5;
  kokoro.platform.v1.PersonalMcpIconSelection icon = 6;
}
message CreatePersonalCustomApiResponse { kokoro.platform.v1.PersonalCustomApi profile = 1; bool replayed = 2; }
message GetPersonalCustomApiRequest {
  reserved 100;
  reserved "tenant_id", "actor_id", "subject_id", "owner_scope", "target_owner_scope", "product_context", "execution_proof", "attestation", "command";
  string request_id = 1;
  kokoro.platform.v1.CustomApiProfileId profile_id = 2;
}
message GetPersonalCustomApiResponse { kokoro.platform.v1.PersonalCustomApi profile = 1; }
message ListPersonalCustomApisRequest {
  reserved 100;
  reserved "tenant_id", "actor_id", "subject_id", "owner_scope", "target_owner_scope", "product_context", "execution_proof", "attestation", "command";
  string request_id = 1;
  kokoro.common.v1.PageRequest page = 2;
}
message ListPersonalCustomApisResponse { repeated kokoro.platform.v1.PersonalCustomApi profiles = 1; kokoro.common.v1.PageResult page = 2; }
message UpdatePersonalCustomApiRequest {
  reserved 100;
  reserved "tenant_id", "actor_id", "subject_id", "owner_scope", "target_owner_scope", "product_context", "execution_proof", "attestation";
  string request_id = 1;
  kokoro.common.v1.CommandIdentity command = 2;
  kokoro.platform.v1.CustomApiProfileId profile_id = 3;
  uint64 expected_state_version = 4;
  optional string name = 5;
  optional string instructions = 6;
  bool clear_instructions = 7;
  repeated kokoro.platform.v1.CustomApiEnvironmentWrite environment_upserts = 8;
  repeated string environment_removals = 9;
  oneof icon_change {
    kokoro.platform.v1.PersonalMcpIconSelection icon = 10;
    bool clear_icon = 11;
  }
}
message UpdatePersonalCustomApiResponse { kokoro.platform.v1.PersonalCustomApi profile = 1; bool replayed = 2; }
message DeletePersonalCustomApiRequest {
  reserved 100;
  reserved "tenant_id", "actor_id", "subject_id", "owner_scope", "target_owner_scope", "product_context", "execution_proof", "attestation";
  string request_id = 1;
  kokoro.common.v1.CommandIdentity command = 2;
  kokoro.platform.v1.CustomApiProfileId profile_id = 3;
  uint64 expected_state_version = 4;
}
message DeletePersonalCustomApiResponse { kokoro.platform.v1.CustomApiProfileId profile_id = 1; bool deleted = 2; bool replayed = 3; }
service ProductCustomApiService {
  rpc CreatePersonalCustomApi(kokoro.platform.v1.CreatePersonalCustomApiRequest) returns (kokoro.platform.v1.CreatePersonalCustomApiResponse);
  rpc GetPersonalCustomApi(kokoro.platform.v1.GetPersonalCustomApiRequest) returns (kokoro.platform.v1.GetPersonalCustomApiResponse);
  rpc ListPersonalCustomApis(kokoro.platform.v1.ListPersonalCustomApisRequest) returns (kokoro.platform.v1.ListPersonalCustomApisResponse);
  rpc UpdatePersonalCustomApi(kokoro.platform.v1.UpdatePersonalCustomApiRequest) returns (kokoro.platform.v1.UpdatePersonalCustomApiResponse);
  rpc DeletePersonalCustomApi(kokoro.platform.v1.DeletePersonalCustomApiRequest) returns (kokoro.platform.v1.DeletePersonalCustomApiResponse);
}

