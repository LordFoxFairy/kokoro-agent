// Canonical contract source owned by kokoro-storage; generated clients are derived from this file.
syntax = "proto3";

package kokoro.common.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_COMMAND_DIGEST_MISMATCH = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_PRECONDITION_FAILED = 7;
  ERROR_CODE_STALE_GENERATION = 8;
  ERROR_CODE_SNAPSHOT_REQUIRED = 9;
  ERROR_CODE_DEPENDENCY_UNAVAILABLE = 10;
  ERROR_CODE_RATE_LIMITED = 11;
  ERROR_CODE_INTERNAL = 12;
  ERROR_CODE_MAGIC_LINK_INVALID = 20;
  ERROR_CODE_MAGIC_LINK_EXPIRED = 21;
  ERROR_CODE_MAGIC_LINK_CONSUMED = 22;
  ERROR_CODE_AUTH_SESSION_REPLAYED = 23;
  ERROR_CODE_AUTH_SESSION_REVOKED = 24;
  ERROR_CODE_CONVERSATION_RUN_ACTIVE = 30;
  ERROR_CODE_CONVERSATION_SCOPE_MISMATCH = 31;
  ERROR_CODE_INTERACTION_NOT_PENDING = 32;
  ERROR_CODE_AGENT_ADMISSION_REJECTED = 40;
}

enum DecisionKind {
  DECISION_KIND_UNSPECIFIED = 0;
  DECISION_KIND_APPROVE = 1;
  DECISION_KIND_EDIT = 2;
  DECISION_KIND_REJECT = 3;
  DECISION_KIND_RESPOND = 4;
  DECISION_KIND_SUBMIT = 5;
}

enum ControlStatus {
  CONTROL_STATUS_UNSPECIFIED = 0;
  CONTROL_STATUS_PENDING = 1;
  CONTROL_STATUS_PERSISTED = 2;
  CONTROL_STATUS_APPLIED = 3;
  CONTROL_STATUS_FAILED = 4;
}

message PrincipalContext {
  string principal_id = 1;
  string tenant_id = 2;
  string organization_id = 3;
  repeated string permission_keys = 4;
}

message IdentityRef {
  string kind = 1;
  string opaque_ref = 2;
}

message ExecutionIdentity {
  string tenant_ref = 1;
  kokoro.common.v1.IdentityRef actor = 2;
  kokoro.common.v1.IdentityRef subject = 3;
  string identity_assertion_ref = 4;
}

message CommandIdentity {
  string command_id = 1;
  string request_digest = 2;
}

message PageRequest {
  uint32 limit = 1;
  optional string cursor = 2;
}

message PageResult {
  optional string next_cursor = 1;
}

message ErrorDetail {
  kokoro.common.v1.ErrorCode code = 1;
  string request_id = 2;
  string message = 3;
  bool retryable = 4;
  optional uint64 current_generation = 5;
}

message ControlDecision {
  kokoro.common.v1.DecisionKind kind = 1;
  string target_id = 2;
  bytes payload_json = 3;
}
