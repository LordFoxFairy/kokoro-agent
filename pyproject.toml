# 声明官方源为默认制品来源。本 lock 曾整份指向本地镜像，CI 因此拉包超时。
# 注意（uv 0.10.4 实测）：本声明**不**覆盖 user-level `~/.config/uv/uv.toml` 里
# `default = true` 的 index —— 用户级配置优先，强制重解析仍会写回镜像 URL。
# 因此在配了镜像的机器上重新解析时必须显式 `UV_NO_CONFIG=1 uv lock`；
# 本声明只在没有冲突用户配置的机器（含 CI）上生效。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
ag-ui-protocol = { git = "https://github.com/ag-ui-protocol/ag-ui", rev = "54f13419055b4d0f442c71e1efab18b310982ce1", subdirectory = "sdks/python" }
