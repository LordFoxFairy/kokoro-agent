[project]
name = "kokoro-agent"
version = "2.0.0"
description = "Kokoro agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ag-ui-protocol==0.1.19",
  "beautifulsoup4>=4.15.0",
  "boto3>=1.43.40",
  "connectrpc==0.10.1",
  "deepagents",
  "e2b>=2.30.0",
  "httpx>=0.28.1",
  "hypercorn==0.17.3",
  "langchain",
  "langchain-anthropic",
  "langchain-deepseek>=1.1.0",
  "langchain-mcp-adapters>=0.3.0",
  "langchain-openai>=1.2.2",
  "langfuse>=4.7.1",
  "langgraph-checkpoint-mongodb>=0.4.0",
  "langgraph-store-mongodb>=0.3.0",
  "mypy-boto3-s3>=1.43.31",
  "prometheus-client>=0.20.0",
  "pyqwest==0.7.0",
  "pydantic>=2",
  "python-dotenv>=1.2.2",
  "redis>=5",
]

[project.scripts]
kokoro-agent-worker = "kokoro_agent.worker.main:main"
kokoro-agent-evidence = "kokoro_agent.evidence.main:main"
kokoro-agent-presentation = "kokoro_agent.presentation.main:main"

[dependency-groups]
dev = [
  "boto3-stubs-lite[s3]>=1.43.40",
  "pyright>=1.1.380",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "protoc-gen-connectrpc==0.10.1",
  "ruff>=0.6",
  "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# 随包分发的非 .py 资源（提示词正文），否则 wheel 会漏掉。
[tool.setuptools.package-data]
kokoro_agent = ["run/*.md", "interaction/generated/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["src/buf", "src/kokoro"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/buf", "src/kokoro"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# langgraph 1.2 core 的 stream/pregel 子模块缺 pyright stub（py.typed 未覆盖）；仅关第三方 stub 提示，不削弱本仓代码检查。
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.11"
# 让 mypy 对着项目 venv 解析导入，否则回退到陈旧全局包、误报 typed 依赖的符号缺失。
python_executable = ".venv/bin/python"

# 这些是真实运行时依赖，但 mypy 解析不到其类型(无 stub / stub 未装)；静默缺 stub 的 import 错误而非用法。
[[tool.mypy.overrides]]
module = ["redis.*", "langfuse.*"]
ignore_missing_imports = true

# numpy 2.5 的 .pyi 用 PEP 695 type 语句(py3.12+)，mypy 在 3.11 目标下解析报 syntax；
# numpy 仅经 mongo checkpointer(langchain-mongodb) 传递引入、本仓不直接用，跳过跟随其源/stub。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.uv]
# 制品来源锁定：本 lock 曾把全部 URL 指向本地镜像，CI 因此拉包超时。
# 这些约束是「按现有解析重锁到官方源、版本零漂移」的必要条件——uv 把
# constraint-dependencies 记进 lock manifest，移除它们会让 `uv lock --check`
# 要求重新解析（并顺带升级依赖）。numpy 用上界而非等值：本 lock 是 universal，
# 它按环境标记同时存在 2.4.6 与 2.5.0，等值钉死会自相矛盾。
constraint-dependencies = [
  "annotated-types==0.7.0",
  "anthropic==0.105.2",
  "anyio==4.13.0",
  "async-timeout==5.0.1",
  "attrs==26.1.0",
